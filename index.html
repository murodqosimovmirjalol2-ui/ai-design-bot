<script>
/* ================================
   AI DESIGN PRO — IMAGE GENERATOR
   ================================ */

const aiPrompt = document.getElementById("aiPrompt");
const aiBtn = document.getElementById("aiGenerateBtn");
const aiResult = document.getElementById("aiResult");
const aiPlaceholder = document.getElementById("aiPlaceholder");

/* AI sozlamalari */
const aiControls = document.createElement("div");
aiControls.className = "ai-controls";

aiControls.innerHTML = `
    <select id="aiStyle">
        <option value="photorealistic">📷 Fotorealistik</option>
        <option value="cinematic">🎬 Cinematic</option>
        <option value="digital art">🎨 Digital Art</option>
        <option value="anime">🌸 Anime</option>
        <option value="3d render">🧊 3D Render</option>
        <option value="fantasy art">🧙 Fantasy</option>
        <option value="minimalist">◽ Minimalist</option>
    </select>

    <select id="aiSize">
        <option value="1024x1024">⬛ 1024 × 1024</option>
        <option value="1280x720">🖥️ 1280 × 720</option>
        <option value="720x1280">📱 720 × 1280</option>
        <option value="1536x1024">🖼️ 1536 × 1024</option>
    </select>
`;

document.querySelector(".ai-input-group").after(aiControls);

const aiStyle = document.getElementById("aiStyle");
const aiSize = document.getElementById("aiSize");

/* Natija oynasi */
const imageBox = document.createElement("div");

imageBox.className = "generated-image-box";

imageBox.innerHTML = `
    <img id="generatedImage"
         alt="AI tomonidan yaratilgan rasm">

    <div class="image-actions">
        <button id="downloadImage">
            ⬇️ Yuklab olish
        </button>

        <button id="openImage">
            🔎 Katta ko‘rish
        </button>

        <button id="regenerateImage">
            🔄 Qayta yaratish
        </button>
    </div>
`;

aiResult.appendChild(imageBox);

const generatedImage =
    document.getElementById("generatedImage");

const downloadImage =
    document.getElementById("downloadImage");

const openImage =
    document.getElementById("openImage");

const regenerateImage =
    document.getElementById("regenerateImage");

let lastImageUrl = "";


/* ================================
   MUHIM:
   PROMPTNI TO‘G‘RI QURISH
   ================================ */

function createProfessionalPrompt(userText) {

    const text = userText.trim();

    /*
       Foydalanuvchi nima yozgan bo‘lsa,
       shu asosiy obyekt bo‘lib qoladi.
    */

    let mainObject = text;

    /* Oddiy so‘zlarni aniq AI tavsifiga aylantiramiz */

    const keywords = {

        "quyosh":
            "a single bright sun in the sky, clearly visible",

        "oy":
            "a single realistic moon in the night sky",

        "yulduz":
            "a beautiful star in the night sky",

        "daraxt":
            "a single large green tree",

        "gul":
            "a beautiful single flower",

        "tog":
            "majestic mountains",

        "tog‘":
            "majestic mountains",

        "dengiz":
            "beautiful blue ocean",

        "okean":
            "beautiful blue ocean",

        "mashina":
            "a modern car",

        "uy":
            "a beautiful house",

        "shahar":
            "a modern city",

        "kosmos":
            "outer space with planets and stars",

        "koinot":
            "outer space with planets and stars"
    };

    const lower = text.toLowerCase();

    for (const word in keywords) {

        if (lower === word) {
            mainObject = keywords[word];
            break;
        }
    }


    /* Style */

    const style = aiStyle.value;


    /*
       NEGATIVE PROMPT:
       keraksiz odam, qiz, yuz va boshqa
       obyektlarning chiqishini kamaytiradi.
    */

    const negativePrompt = `
unwanted people,
woman,
girl,
man,
person,
human,
face,
portrait,
body,
extra objects,
random objects,
text,
letters,
watermark,
logo,
distorted objects,
duplicate objects,
blurry,
low quality
`;


    return `
Create an image of ONLY this main subject:

${mainObject}

The main subject must be the clear focus of the image.

Do NOT invent unrelated subjects.

If the user says "sun", show a sun.
If the user says "moon", show a moon.
If the user says "tree", show a tree.

Do not add a person unless the user explicitly asks for a person.

Style:
${style}

Professional composition,
high detail,
sharp focus,
beautiful lighting,
natural colors,
high quality,
detailed background,
professional photography,
4K quality.

Negative prompt:
${negativePrompt}
`;
}


/* ================================
   RASM YARATISH
   ================================ */

async function generateImage() {

    const text = aiPrompt.value.trim();

    if (!text) {

        aiPlaceholder.style.display = "block";

        aiPlaceholder.textContent =
            "⚠️ Avval rasm nima bo‘lishini yozing.";

        aiPrompt.focus();

        return;
    }


    const [width, height] =
        aiSize.value.split("x").map(Number);


    /* Professional prompt */

    const finalPrompt =
        createProfessionalPrompt(text);


    /*
       Har safar yangi rasm olish uchun
       random seed.
    */

    const seed =
        Math.floor(Math.random() * 999999999);


    /*
       Pollinations AI
    */

    const url =
        "https://image.pollinations.ai/prompt/" +
        encodeURIComponent(finalPrompt) +
        "?width=" + width +
        "&height=" + height +
        "&seed=" + seed +
        "&nologo=true" +
        "&enhance=true";


    /* Loading */

    aiBtn.disabled = true;

    aiBtn.innerHTML =
        "⏳ Rasm yaratilmoqda...";

    aiPlaceholder.style.display =
        "block";

    aiPlaceholder.textContent =
        "🧠 AI siz yozgan g‘oya asosida rasm yaratmoqda...";

    imageBox.classList.remove("ready");


    /* Rasm yuklash */

    generatedImage.onload = function() {

        aiBtn.disabled = false;

        aiBtn.innerHTML =
            "✨ Yaratish";

        aiPlaceholder.style.display =
            "none";

        imageBox.classList.add("ready");

        lastImageUrl = url;
    };


    /* Xatolik */

    generatedImage.onerror = function() {

        aiBtn.disabled = false;

        aiBtn.innerHTML =
            "✨ Yaratish";

        aiPlaceholder.style.display =
            "block";

        aiPlaceholder.textContent =
            "❌ Rasm yaratishda xatolik. Internetni tekshiring.";

        imageBox.classList.remove("ready");
    };


    generatedImage.src = url;
}


/* Tugma */

aiBtn.addEventListener(
    "click",
    generateImage
);


/* Enter bilan yaratish */

aiPrompt.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            generateImage();
        }

    }
);


/* Qayta yaratish */

regenerateImage.addEventListener(
    "click",
    generateImage
);


/* Katta ko‘rish */

openImage.addEventListener(
    "click",
    function() {

        if (lastImageUrl) {
            window.open(
                lastImageUrl,
                "_blank"
            );
        }

    }
);


/* ================================
   YUKLAB OLISH
   ================================ */

downloadImage.addEventListener(
    "click",
    async function() {

        if (!lastImageUrl)
            return;

        try {

            const response =
                await fetch(lastImageUrl);

            const blob =
                await response.blob();

            const blobUrl =
                URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = blobUrl;

            a.download =
                "AI-DESIGN-" +
                Date.now() +
                ".jpg";

            document.body.appendChild(a);

            a.click();

            a.remove();

            setTimeout(
                () => URL.revokeObjectURL(blobUrl),
                2000
            );

        } catch (error) {

            window.open(
                lastImageUrl,
                "_blank"
            );

        }

    }
);
</script>
