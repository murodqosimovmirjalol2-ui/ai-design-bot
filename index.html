<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Store Control">
<meta name="description" content="Supermarket boshqaruv tizimi">
<title>Store Control</title>

<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:#f0f2f5;color:#333;line-height:1.5;overscroll-behavior:none;
-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
.app{max-width:500px;margin:0 auto;min-height:100vh;background:#f0f2f5;
position:relative;padding-bottom:90px;transition:background .3s}
.sidebar{display:none}
.desktop-wrapper{display:contents}

/* =========================================================
   SPLASH SCREEN
   ========================================================= */
#splash{position:fixed;inset:0;z-index:99999;
background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
display:flex;flex-direction:column;align-items:center;justify-content:center;
transition:opacity .5s ease,visibility .5s ease}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{width:120px;height:120px;border-radius:28px;
box-shadow:0 20px 60px rgba(0,0,0,.35);animation:splashScale .8s ease-out;
object-fit:cover}
@keyframes splashScale{0%{transform:scale(0) rotate(-180deg);opacity:0}
60%{transform:scale(1.15) rotate(10deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.splash-title{margin-top:24px;font-size:28px;font-weight:800;color:white;
letter-spacing:.5px;animation:splashFade .8s ease-out .3s both}
.splash-subtitle{margin-top:6px;font-size:13px;color:rgba(255,255,255,.75);
letter-spacing:2px;text-transform:uppercase;animation:splashFade .8s ease-out .4s both}
@keyframes splashFade{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.splash-loader{margin-top:40px;display:flex;gap:8px;animation:splashFade .8s ease-out .6s both}
.splash-loader span{width:10px;height:10px;border-radius:50%;background:white;
animation:bounce 1.4s ease-in-out infinite both}
.splash-loader span:nth-child(1){animation-delay:0s}
.splash-loader span:nth-child(2){animation-delay:.16s}
.splash-loader span:nth-child(3){animation-delay:.32s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* =========================================================
   LOGIN SCREEN
   ========================================================= */
#login{position:fixed;inset:0;z-index:9998;
background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:24px;transition:opacity .4s ease,visibility .4s ease}
#login.hide{opacity:0;visibility:hidden;pointer-events:none}
.login-container{width:100%;max-width:420px;
background:white;border-radius:24px;padding:32px 24px;
box-shadow:0 30px 80px rgba(0,0,0,.3);animation:loginIn .5s ease-out}
@keyframes loginIn{from{opacity:0;transform:translateY(30px) scale(.95)}
to{opacity:1;transform:translateY(0) scale(1)}}
.login-logo{width:80px;height:80px;border-radius:20px;margin:0 auto 20px;
display:block;object-fit:cover;box-shadow:0 10px 30px rgba(102,126,234,.4)}
.login-title{text-align:center;font-size:24px;font-weight:800;color:#333;margin-bottom:6px}
.login-subtitle{text-align:center;font-size:13px;color:#888;margin-bottom:28px}
.login-question{text-align:center;font-size:14px;color:#666;
font-weight:600;margin-bottom:16px}
.role-btn{width:100%;padding:20px;border:2px solid #e5e7eb;border-radius:16px;
background:white;cursor:pointer;font-family:inherit;
display:flex;align-items:center;gap:16px;margin-bottom:12px;
transition:all .2s;text-align:left}
.role-btn:hover{border-color:#667eea;transform:translateY(-2px);
box-shadow:0 8px 24px rgba(102,126,234,.15)}
.role-btn:active{transform:translateY(0)}
.role-btn .ico{font-size:36px;flex-shrink:0}
.role-btn .txt{flex:1}
.role-btn .txt strong{display:block;font-size:16px;color:#333;margin-bottom:2px}
.role-btn .txt span{font-size:12px;color:#888}
.role-btn .arrow{font-size:20px;color:#ccc;transition:transform .2s}
.role-btn:hover .arrow{transform:translateX(4px);color:#667eea}
.role-btn.manager:hover{border-color:#8b5cf6}
.role-btn.employee:hover{border-color:#10b981}
.role-btn.manager .ico{background:#ede9fe;width:60px;height:60px;
border-radius:16px;display:flex;align-items:center;justify-content:center}
.role-btn.employee .ico{background:#d1fae5;width:60px;height:60px;
border-radius:16px;display:flex;align-items:center;justify-content:center}

/* Employee select */
.emp-select{width:100%;padding:12px 14px;border:2px solid #e5e7eb;
border-radius:12px;font-size:15px;font-family:inherit;
background:#fafbfc;margin-bottom:16px}
.emp-select:focus{outline:none;border-color:#667eea;background:white}

/* Login buttons */
.login-btn{width:100%;padding:14px;border:none;border-radius:12px;
font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
transition:all .2s;margin-bottom:8px}
.login-btn.primary{background:linear-gradient(135deg,#667eea,#764ba2);color:white}
.login-btn.primary:hover{transform:translateY(-2px);
box-shadow:0 8px 20px rgba(102,126,234,.4)}
.login-btn.back{background:#f3f4f6;color:#666}
.login-btn.back:hover{background:#e5e7eb}

/* =========================================================
   HEADER
   ========================================================= */
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
color:white;padding:16px 20px;position:sticky;top:0;z-index:100;
box-shadow:0 4px 20px rgba(102,126,234,.3)}
.header.employee{background:linear-gradient(135deg,#10b981 0%,#059669 100%);
box-shadow:0 4px 20px rgba(16,185,129,.3)}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.header h1 img{width:32px;height:32px;border-radius:8px;object-fit:cover;flex-shrink:0}
.header h1 span{overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;gap:8px;align-items:center;flex-shrink:0}
.role-badge{background:rgba(255,255,255,.25);padding:5px 10px;border-radius:20px;
font-size:10px;font-weight:700;backdrop-filter:blur(10px);white-space:nowrap;
letter-spacing:.3px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{background:rgba(255,255,255,.2);border:none;color:white;
width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;
display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);
transition:background .2s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.3)}
.refresh-btn{display:none}

/* =========================================================
   STATS
   ========================================================= */
.stats{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:white;border-radius:14px;padding:14px;
box-shadow:0 2px 8px rgba(0,0,0,.04);position:relative;overflow:hidden;
transition:transform .2s,background .3s}
.stat:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#667eea}
.stat.blue::before{background:#3b82f6}
.stat.green::before{background:#10b981}
.stat.orange::before{background:#f59e0b}
.stat.red::before{background:#ef4444}
.stat.purple::before{background:#8b5cf6}
.stat.yellow::before{background:#eab308}
.stat .label{font-size:10px;color:#888;font-weight:600;
letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.stat .value{font-size:24px;font-weight:800;color:#333;line-height:1}

/* =========================================================
   NAV
   ========================================================= */
.nav{background:white;margin:0 12px 12px;padding:5px;border-radius:14px;
display:flex;gap:3px;box-shadow:0 2px 8px rgba(0,0,0,.04);
position:sticky;top:64px;z-index:99;overflow-x:auto;scrollbar-width:none;
transition:background .3s}
.nav::-webkit-scrollbar{display:none}
.nav-btn{min-width:60px;flex:1;padding:8px 4px;border:none;background:transparent;
border-radius:10px;cursor:pointer;font-size:10px;font-weight:600;
color:#666;display:flex;flex-direction:column;align-items:center;
gap:3px;font-family:inherit;transition:all .2s}
.nav-btn .ico{font-size:18px;line-height:1}
.nav-btn.active{background:linear-gradient(135deg,#667eea,#764ba2);
color:white;box-shadow:0 4px 12px rgba(102,126,234,.3)}
body.employee-mode .nav-btn.active{background:linear-gradient(135deg,#10b981,#059669);
box-shadow:0 4px 12px rgba(16,185,129,.3)}

/* =========================================================
   CONTENT
   ========================================================= */
.content{padding:0 12px}
.section{display:none}
.section.active{display:block}
.list-item{background:white;border-radius:14px;padding:14px;margin-bottom:8px;
box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;
gap:12px;animation:fadeIn .3s;transition:box-shadow .2s,background .3s}
.list-item:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1}}

.avatar{width:42px;height:42px;border-radius:50%;display:flex;
align-items:center;justify-content:center;font-weight:800;color:white;
font-size:14px;flex-shrink:0}
.avatar.blue{background:#3b82f6}
.avatar.green{background:#10b981}
.avatar.purple{background:#8b5cf6}
.avatar.orange{background:#f59e0b}
.avatar.red{background:#ef4444}
.avatar.yellow{background:#eab308}

.info{flex:1;min-width:0}
.info .title{font-weight:700;font-size:14px;margin-bottom:2px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .sub{font-size:12px;color:#888;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.badge{padding:4px 10px;border-radius:12px;font-size:10px;font-weight:700;
white-space:nowrap}
.badge.blue{background:#dbeafe;color:#1e40af}
.badge.green{background:#d1fae5;color:#065f46}
.badge.orange{background:#fef3c7;color:#92400e}
.badge.red{background:#fee2e2;color:#991b1b}
.badge.purple{background:#ede9fe;color:#6b21a8}
.badge.yellow{background:#fef9c3;color:#854d0e}
.badge.gray{background:#f3f4f6;color:#4b5563}

.actions{display:flex;gap:6px;margin-top:8px}
.btn{padding:6px 12px;border:none;border-radius:8px;font-size:11px;
font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.95)}
.btn-sm{padding:6px 10px;font-size:11px}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:white}
.btn-success{background:#10b981;color:white}
.btn-danger{background:#ef4444;color:white}
.btn-del{background:#fee2e2;color:#dc2626;padding:6px 8px;font-size:14px;
border-radius:8px;border:none;cursor:pointer}
.btn-del:hover{background:#fecaca}

/* =========================================================
   SROK
   ========================================================= */
.srok-item{background:white;border-radius:14px;padding:14px;margin-bottom:8px;
box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;
gap:12px;border-left:4px solid #e5e7eb;animation:fadeIn .3s;transition:background .3s}
.srok-item.expired{border-left-color:#ef4444;background:#fef2f2}
.srok-item.today{border-left-color:#dc2626;background:#fee2e2}
.srok-item.critical{border-left-color:#f59e0b;background:#fffbeb}
.srok-item.warning{border-left-color:#eab308;background:#fefce8}
.srok-item.normal{border-left-color:#10b981}
.srok-days{font-size:20px;font-weight:800;color:#666;text-align:center;min-width:50px}
.srok-days.expired{color:#ef4444}
.srok-days.today{color:#dc2626}
.srok-days.critical{color:#f59e0b}
.srok-days.warning{color:#eab308}
.srok-days.normal{color:#10b981}
.srok-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;
padding:12px;margin-bottom:8px}
.srok-stat{background:white;border-radius:12px;padding:12px;
text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04);
border-top:3px solid #e5e7eb;transition:background .3s}
.srok-stat.expired{border-top-color:#ef4444}
.srok-stat.today{border-top-color:#dc2626}
.srok-stat.critical{border-top-color:#f59e0b}
.srok-stat.warning{border-top-color:#eab308}
.srok-stat.normal{border-top-color:#10b981}
.srok-stat .num{font-size:22px;font-weight:800;margin-bottom:2px}
.srok-stat .lbl{font-size:10px;color:#888;font-weight:600;text-transform:uppercase}

.empty{text-align:center;padding:50px 20px;color:#999}
.empty .ico{font-size:56px;margin-bottom:12px;opacity:.4}
.empty p{font-size:13px}

/* =========================================================
   FAB
   ========================================================= */
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;
border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);
color:white;border:none;font-size:24px;cursor:pointer;
box-shadow:0 6px 20px rgba(102,126,234,.4);z-index:50;
display:flex;align-items:center;justify-content:center;transition:transform .2s}
.fab:active{transform:scale(.9)}
.fab:hover{transform:scale(1.05)}
.fab.hidden{display:none}

/* =========================================================
   MODAL
   ========================================================= */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);
backdrop-filter:blur(4px);z-index:1000;display:none;
align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:white;border-radius:24px 24px 0 0;padding:24px;
width:100%;max-width:500px;max-height:90vh;overflow-y:auto;
animation:slideUp .3s ease;transition:background .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{margin-bottom:18px;font-size:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;
border:2px solid #e5e7eb;border-radius:12px;font-size:15px;
font-family:inherit;background:#fafbfc;transition:border-color .2s,background .3s}
.field input:focus,.field select:focus,.field textarea:focus{
outline:none;border-color:#667eea;background:white}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn-lg{padding:12px 24px;font-size:14px;border-radius:12px}
.btn-cancel{background:#f3f4f6;color:#666}

/* =========================================================
   TOAST
   ========================================================= */
.toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,200px);
background:#1f2937;color:white;padding:12px 20px;border-radius:12px;
font-size:13px;font-weight:600;z-index:2000;transition:transform .3s;
max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.success{background:#059669}
.toast.error{background:#dc2626}
.toast.warning{background:#d97706}

.data-actions{display:flex;gap:8px;margin-top:12px}
.data-actions button{flex:1;padding:10px;border:none;border-radius:10px;
font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.data-actions .export{background:#dbeafe;color:#1e40af}
.data-actions .import{background:#d1fae5;color:#065f46}
.data-actions .clear{background:#fee2e2;color:#991b1b}

/* =========================================================
   DESKTOP
   ========================================================= */
@media (min-width:768px){
  body{background:#e5e7eb}
  .desktop-wrapper{display:grid;grid-template-columns:260px 1fr;
    min-height:100vh;max-width:1400px;margin:0 auto;background:#f0f2f5;
    box-shadow:0 0 60px rgba(0,0,0,.1);transition:background .3s}
  .sidebar{display:flex;flex-direction:column;
    background:linear-gradient(180deg,#667eea 0%,#764ba2 100%);
    color:white;padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
  body.employee-mode .sidebar{background:linear-gradient(180deg,#10b981 0%,#059669 100%)}
  .sidebar-logo{padding:0 20px 24px;border-bottom:1px solid rgba(255,255,255,.15);
    margin-bottom:20px;display:flex;align-items:center;gap:10px;
    font-size:18px;font-weight:700}
  .sidebar-logo img{width:36px;height:36px;border-radius:10px;object-fit:cover}
  .sidebar-nav{display:flex;flex-direction:column;gap:4px;padding:0 12px;flex:1}
  .sidebar-btn{padding:12px 16px;border:none;background:transparent;
    color:rgba(255,255,255,.8);border-radius:10px;cursor:pointer;font-size:14px;
    font-weight:600;font-family:inherit;display:flex;align-items:center;
    gap:12px;transition:all .2s;text-align:left}
  .sidebar-btn .ico{font-size:20px}
  .sidebar-btn:hover{background:rgba(255,255,255,.1);color:white}
  .sidebar-btn.active{background:rgba(255,255,255,.2);color:white;
    box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .sidebar-btn .badge-count{margin-left:auto;background:rgba(255,255,255,.25);
    padding:2px 8px;border-radius:10px;font-size:11px}
  .sidebar-user{padding:16px 20px;border-top:1px solid rgba(255,255,255,.15);
    font-size:12px;color:rgba(255,255,255,.9)}
  .sidebar-user .name{font-weight:700;margin-bottom:2px}
  .sidebar-user .role{font-size:10px;opacity:.7;text-transform:uppercase;
    letter-spacing:1px;margin-bottom:8px}
  .sidebar-user .logout{background:rgba(255,255,255,.15);border:none;
    color:white;padding:6px 12px;border-radius:8px;font-size:11px;
    cursor:pointer;font-family:inherit;width:100%;font-weight:600}
  .sidebar-user .logout:hover{background:rgba(255,255,255,.25)}
  .main{display:flex;flex-direction:column;min-height:100vh;background:#f0f2f5;
    transition:background .3s}
  .header{padding:20px 32px;position:sticky;top:0;z-index:100}
  .header h1{font-size:22px}
  .header h1 img{width:38px;height:38px}
  .refresh-btn{display:flex}
  .stats{padding:24px 32px 12px;grid-template-columns:repeat(6,1fr);gap:16px}
  .stat{padding:18px 20px;border-radius:16px}
  .stat .label{font-size:11px}
  .stat .value{font-size:32px}
  .nav{display:none}
  .content{padding:12px 32px 32px}
  .list-item,.srok-item{padding:18px 20px;border-radius:16px;margin-bottom:12px}
  .avatar{width:48px;height:48px;font-size:16px}
  .info .title{font-size:15px}
  .info .sub{font-size:13px}
  .badge{font-size:11px;padding:5px 12px}
  .empty{padding:80px 20px}
  .empty .ico{font-size:80px}
  .empty p{font-size:15px}
  .fab{width:64px;height:64px;font-size:28px;bottom:32px;right:32px}
  .modal-bg{align-items:center;padding:20px}
  .modal{border-radius:20px;max-width:520px;animation:fadeInScale .25s ease}
  @keyframes fadeInScale{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
  .toast{bottom:32px;left:auto;right:32px;transform:translate(0,200px)}
  .toast.show{transform:translate(0,0)}
  .srok-stats{grid-template-columns:repeat(5,1fr);padding:24px 32px 12px;gap:16px}
  .srok-stat .num{font-size:28px}
}

@media (min-width:1200px){
  .desktop-wrapper{grid-template-columns:280px 1fr}
  .stats{grid-template-columns:repeat(6,1fr);gap:20px}
  .stat .value{font-size:36px}
  .content{padding:12px 40px 40px}
}

/* =========================================================
   DARK MODE
   ========================================================= */
body.dark{background:#0f172a !important;color:#f1f5f9 !important}
body.dark .app,
body.dark .desktop-wrapper,
body.dark .main{background:#0f172a !important}
body.dark .header{background:linear-gradient(135deg,#4c1d95 0%,#1e1b4b 100%) !important}
body.dark.employee-mode .header{background:linear-gradient(135deg,#064e3b 0%,#022c22 100%) !important}
body.dark .stat,
body.dark .list-item,
body.dark .srok-item,
body.dark .nav,
body.dark .srok-stat{background:#1e293b !important;color:#f1f5f9 !important}
body.dark .stat .label,
body.dark .info .sub,
body.dark .srok-stat .lbl{color:#94a3b8 !important}
body.dark .stat .value,
body.dark .info .title,
body.dark .srok-stat .num{color:#f1f5f9 !important}
body.dark .nav-btn{color:#94a3b8 !important}
body.dark .modal{background:#1e293b !important;color:#f1f5f9 !important}
body.dark .field input,
body.dark .field select,
body.dark .field textarea{
  background:#0f172a !important;color:#f1f5f9 !important;
  border-color:#334155 !important
}
body.dark .field label{color:#cbd5e1 !important}
body.dark .btn-cancel{background:#334155 !important;color:#cbd5e1 !important}
body.dark .sidebar{background:linear-gradient(180deg,#4c1d95 0%,#1e1b4b 100%) !important}
body.dark.employee-mode .sidebar{background:linear-gradient(180deg,#064e3b 0%,#022c22 100%) !important}

</style>
</head>
<body>

<!-- SPLASH SCREEN -->

  <img src="logo.png" class="splash-logo" alt="Store Control" onerror="this.style.display='none'">
  <div class="splash-title">Store Control</div>
  <div class="splash-subtitle">Supermarket tizimi</div>
  <div class="splash-loader">
    <span></span><span></span><span></span>
  </div>
</div>

<!-- LOGIN SCREEN -->
<div id="login">
  <div class="login-container">
    <img src="logo.png" class="login-logo" alt="Logo" onerror="this.style.display='none'">
    <div class="login-title">Store Control</div>
    <div class="login-subtitle">Supermarket boshqaruv tizimi</div>

    <div id="loginStep1">
      <div class="login-question">👤 Kim sifatida kirmoqchisiz?</div>

      <button class="role-btn manager" onclick="selectRole('manager')">
        <div class="ico">👨‍💼</div>
        <div class="txt">
          <strong>Menejer</strong>
          <span>To'liq boshqaruv huquqi</span>
        </div>
        <div class="arrow">›</div>

        <div class="txt">

        ✅ Kirish

<!-- MAIN APP -->
<div class="desktop-wrapper" id="mainApp" style="display:none">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
      <span>Store Control</span>
    </div>
    <nav class="sidebar-nav">
      <button class="sidebar-btn active" data-tab="employees">
        <span class="ico">👥</span><span>Xodimlar</span>
        <span class="badge-count" id="cnt-emp">0</span>
      </button>
      <button class="sidebar-btn" data-tab="shifts">
        <span class="ico">🕐</span><span>Smenalar</span>
        <span class="badge-count" id="cnt-shift">0</span>
      </button>
      <button class="sidebar-btn" data-tab="tasks">
        <span class="ico">📋</span><span>Topshiriqlar</span>
        <span class="badge-count" id="cnt-task">0</span>
      </button>
      <button class="sidebar-btn" data-tab="products">
        <span class="ico">📦</span><span>Tovarlar</span>
        <span class="badge-count" id="cnt-prod">0</span>
      </button>
      <button class="sidebar-btn" data-tab="expiry">
        <span class="ico">⏰</span><span>Srok</span>
        <span class="badge-count" id="cnt-srok">0</span>
      </button>
      <button class="sidebar-btn" data-tab="issues">
        <span class="ico">⚠️</span><span>Muammolar</span>
        <span class="badge-count" id="cnt-issue">0</span>
      </button>
    </nav>
    <div class="sidebar-user">
      <div class="name" id="sidebarUserName">—</div>
      <div class="role" id="sidebarUserRole">—</div>
      <button class="logout" onclick="logout()">🚪 Chiqish</button>
    </div>
  </aside>

  <main class="main">
    <div class="app">
      <div class="header" id="appHeader">
        <div class="header-top">
          <h1>
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
            <span id="headerTitle">Store Control</span>
          </h1>
          <div class="header-right">
            <span class="role-badge" id="headerRole">👨‍💼 MENEJER</span>
            <button class="icon-btn refresh-btn" onclick="refresh()" title="Yangilash">🔄</button>
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Rejim">🌙</button>
            <button class="icon-btn" onclick="openSettings()" id="settingsBtn" title="Sozlamalar">⚙️</button>
            <button class="icon-btn" onclick="logout()" id="logoutBtn" title="Chiqish" style="display:none">🚪</button>

      <div class="stats">
        <div class="stat blue"><div class="label">Xodimlar</div><div class="value" id="sEmp">0</div></div>
        <div class="stat green"><div class="label">Smenalar</div><div class="value" id="sShift">0</div></div>
        <div class="stat orange"><div class="label">Topshiriq</div><div class="value" id="sTask">0</div></div>
        <div class="stat red"><div class="label">Muammo</div><div class="value" id="sIssue">0</div></div>
        <div class="stat purple"><div class="label">Tovarlar</div><div class="value" id="sProduct">0</div></div>
        <div class="stat yellow"><div class="label">⚠️ Srok</div><div class="value" id="sSrok">0</div></div>
      </div>

      <div class="nav">
        <button class="nav-btn active" data-tab="employees"><span class="ico">👥</span>Xodimlar</button>
        <button class="nav-btn" data-tab="shifts"><span class="ico">🕐</span>Smenalar</button>
        <button class="nav-btn" data-tab="tasks"><span class="ico">📋</span>Topshiriq</button>
        <button class="nav-btn" data-tab="products"><span class="ico">📦</span>Tovarlar</button>
        <button class="nav-btn" data-tab="expiry"><span class="ico">⏰</span>Srok</button>
        <button class="nav-btn" data-tab="issues"><span class="ico">⚠️</span>Muammo</button>
      </div>

      <div class="content">
        <div class="section active" id="sec-employees"></div>
        <div class="section" id="sec-shifts"></div>
        <div class="section" id="sec-tasks"></div>
        <div class="section" id="sec-products"></div>

<!-- FAB -->
<button class="fab" id="fabBtn" onclick="openModal()" style="display:none">➕</button>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal" id="modalContent" onclick="event.stopPropagation()"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// =========================================================
// MA'LUMOTLAR BAZASI
// =========================================================
const DB = {
  stores: [], employees: [], shifts: [], shift_instances: [],
  tasks: [], products: [], product_batches: [], issues: [],

  load(){
    const data = localStorage.getItem('store_control_db');
    if(data){
      try {
        const parsed = JSON.parse(data);
        Object.assign(this, parsed);
        if(!Array.isArray(this.product_batches)) this.product_batches = [];
      } catch(e){ this.seed(); }
    } else { this.seed(); }
  },

  seed(){
    this.stores = [{id:1, name:"Asosiy Do'kon", address:"Toshkent"}];
    this.shifts = [
      {id:1, store_id:1, name:"1-smena", start_time:"08:00", end_time:"16:00"},
      {id:2, store_id:1, name:"2-smena", start_time:"16:00", end_time:"00:00"}
    ];
    this.product_batches = [];
    this.save();
  },

  save(){
    localStorage.setItem('store_control_db', JSON.stringify({
      stores: this.stores, employees: this.employees, shifts: this.shifts,
      shift_instances: this.shift_instances, tasks: this.tasks,
      products: this.products, product_batches: this.product_batches,
      issues: this.issues
    }));
  },

  nextId(table){
    const items = this[table];
    if(!items.length) return 1;
    return Math.max(...items.map(i=>i.id)) + 1;
  },

  export(){
    const data = {
      stores: this.stores, employees: this.employees, shifts: this.shifts,
      shift_instances: this.shift_instances, tasks: this.tasks,
      products: this.products, product_batches: this.product_batches,
      issues: this.issues, exported_at: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'store-control-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  },

  import(data){
    if(!data || typeof data !== 'object') throw new Error('Noto\'g\'ri format');
    ['stores','employees','shifts','shift_instances','tasks','products','product_batches','issues'].forEach(k=>{
      if(Array.isArray(data[k])) this[k] = data[k];
    });
    this.save();
  }
};

// =========================================================
// FOYDALANUVCHI
// =========================================================
let currentUser = {
  role: null,        // 'manager' | 'employee'
  employeeId: null,
  employeeName: null
};

let currentTab = 'employees';

function loadUser(){
  const data = localStorage.getItem('store_control_user');
  if(data){
    try {
      const parsed = JSON.parse(data);
      if(parsed.role) currentUser = parsed;
    } catch(e){}
  }
}

function saveUser(){
  localStorage.setItem('store_control_user', JSON.stringify(currentUser));
}

function clearUser(){
  localStorage.removeItem('store_control_user');
  currentUser = { role: null, employeeId: null, employeeName: null };
}

// =========================================================
// LOGIN LOGIKASI
// =========================================================
function selectRole(role){
  if(role === 'manager'){
    currentUser = { role: 'manager', employeeId: null, employeeName: 'Menejer' };
    saveUser();
    enterApp();
  } else {
    // Employee tanlash
    const select = document.getElementById('employeeSelect');
    select.innerHTML = '<option value="">— Xodimni tanlang —</option>' +
      DB.employees.map(e => `<option value="${e.id}">${esc(e.name)} (${e.role})</option>`).join('');
    document.getElementById('loginStep1').style.display = 'none';
    document.getElementById('loginStep2').style.display = 'block';
  }
}

function backToStep1(){
  document.getElementById('loginStep1').style.display = 'block';
  document.getElementById('loginStep2').style.display = 'none';
}

function confirmEmployee(){
  const empId = parseInt(document.getElementById('employeeSelect').value);
  if(!empId){
    toast('⚠️ Xodimni tanlang!', 'error');
    return;
  }
  const emp = DB.employees.find(e => e.id === empId);
  if(!emp){
    toast('⚠️ Xodim topilmadi!', 'error');
    return;
  }
  currentUser = { role: 'employee', employeeId: empId, employeeName: emp.name };
  saveUser();
  enterApp();
}

function enterApp(){
  document.getElementById('login').classList.add('hide');
  document.getElementById('mainApp').style.display = '';
  applyRole();
  refresh();
}

function applyRole(){
  const isEmployee = currentUser.role === 'employee';
  const body = document.body;

  // Body class
  body.classList.toggle('employee-mode', isEmployee);

  // Header
  const header = document.getElementById('appHeader');
  header.classList.toggle('employee', isEmployee);

  // Header role badge
  document.getElementById('headerRole').textContent =
    isEmployee ? '👷 XODIM' : '👨‍💼 MENEJER';

  // Header title
  document.getElementById('headerTitle').textContent =
    isEmployee ? currentUser.employeeName : 'Store Control';

  // Sidebar user
  document.getElementById('sidebarUserName').textContent =
    isEmployee ? currentUser.employeeName : 'Menejer';
  document.getElementById('sidebarUserRole').textContent =
    isEmployee ? 'Xodim' : 'Menejer';

  // Logout button (mobil uchun)
  document.getElementById('logoutBtn').style.display = isEmployee ? 'flex' : 'none';

  // FAB — faqat menejer uchun
  document.getElementById('fabBtn').style.display = isEmployee ? 'none' : 'flex';

  // Sozlamalar tugmasi
  document.getElementById('settingsBtn').style.display = isEmployee ? 'none' : 'flex';
}

function logout(){
  if(!confirm('Tizimdan chiqmoqchimisiz?')) return;
  clearUser();
  document.getElementById('login').classList.remove('hide');
  document.getElementById('mainApp').style.display = 'none';
  document.body.classList.remove('employee-mode');
  backToStep1();
}

// =========================================================
// SROK
// =========================================================
function getSrokStatus(expiryDate){
  if(!expiryDate) return {cls:'normal', label:'—', days:null};
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(expiryDate); exp.setHours(0,0,0,0);
  const days = Math.floor((exp - today) / (1000*60*60*24));
  if(days < 0) return {cls:'expired', label:'Muddati o\'tgan', days, ico:'🔴'};
  if(days === 0) return {cls:'today', label:'Bugun tugaydi', days, ico:'🟡'};
  if(days <= 3) return {cls:'critical', label:'Tez tugaydi', days, ico:'🟠'};
  if(days <= 7) return {cls:'warning', label:'Ogohlantirish', days, ico:'🟢'};
  return {cls:'normal', label:'Normada', days, ico:'⚪'};
}

function srokStats(){
  const stats = {expired:0, today:0, critical:0, warning:0, normal:0};
  DB.product_batches.forEach(b=>{
    if(b.quantity <= 0) return;
    const s = getSrokStatus(b.expiry_date);
    stats[s.cls] = (stats[s.cls]||0) + 1;
  });
  return stats;
}

// =========================================================
// TOAST
// =========================================================
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type||'');
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>t.classList.remove('show'),2500);
}

// =========================================================
// THEME
// =========================================================
function toggleTheme(){
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('store_theme', isDark ? 'dark' : 'light');
}

(function(){
  const saved = localStorage.getItem('store_theme');
  if(saved === 'dark'){
    document.body.classList.add('dark');
    setTimeout(()=>{
      const btn = document.getElementById('themeBtn');
      if(btn) btn.textContent = '☀️';
    }, 100);
  }
})();

// =========================================================
// STATS
// =========================================================
function loadStats(){
  const isEmployee = currentUser.role === 'employee';

  let activeShifts, openTasks;

  if(isEmployee){
    // Faqat o'z ma'lumotlari
    activeShifts = DB.shift_instances.filter(s =>
      s.status==='active' && s.employee_id === currentUser.employeeId).length;
    openTasks = DB.tasks.filter(t =>
      t.assigned_employee_id === currentUser.employeeId &&
      t.status !== 'completed').length;
  } else {
    activeShifts = DB.shift_instances.filter(s=>s.status==='active').length;
    openTasks = DB.tasks.filter(t=>t.status!=='completed').length;
  }

  const openIssues = DB.issues.filter(i=>i.status==='open').length;
  const srokS = srokStats();
  const problemSrok = srokS.expired + srokS.today + srokS.critical;

  document.getElementById('sEmp').textContent = isEmployee ? '—' : DB.employees.length;
  document.getElementById('sShift').textContent = activeShifts;
  document.getElementById('sTask').textContent = openTasks;
  document.getElementById('sIssue').textContent = openIssues;
  document.getElementById('sProduct').textContent = DB.products.length;
  const srokEl = document.getElementById('sSrok');
  srokEl.textContent = problemSrok;
  srokEl.style.color = problemSrok === 0 ? '#10b981' : (problemSrok < 3 ? '#f59e0b' : '#ef4444');

  const setC = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
  setC('cnt-emp', isEmployee ? '—' : DB.employees.length);
  setC('cnt-shift', activeShifts);
  setC('cnt-task', openTasks);
  setC('cnt-prod', DB.products.length);
  setC('cnt-srok', problemSrok);
  setC('cnt-issue', openIssues);
}

// =========================================================
// HELPERS
// =========================================================
function empty(ico, txt){
  return '<div class="empty"><div class="ico">'+ico+'</div><p>'+txt.replace(/\n/g,'<br>')+'</p></div>';
}
function badge(txt, cls){ return '<span class="badge '+(cls||'gray')+'">'+txt+'</span>'; }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('uz-UZ', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function isManager(){ return currentUser.role === 'manager'; }

// =========================================================
// RENDER — XODIMLAR
// =========================================================
function renderEmployees(){
  const sec = document.getElementById('sec-employees');

  if(!DB.employees.length){
    sec.innerHTML = empty('👥','Xodimlar yo\'q.\n➕ tugmasini bosing!');
    return;
  }

  sec.innerHTML = DB.employees.map(e=>`
    <div class="list-item">
      <div class="avatar blue">${e.id}</div>
      <div class="info">
        <div class="title">${esc(e.name)}</div>
        <div class="sub">${esc(e.phone)||'—'}</div>
      </div>
      ${badge(e.role,'blue')}
      ${isManager() ? `<button class="btn-del" onclick="deleteItem('employees',${e.id})">🗑️</button>` : ''}
    </div>
  `).join('');
}

// =========================================================
// RENDER — SMENALAR
// =========================================================
function renderShifts(){
  const sec = document.getElementById('sec-shifts');
  let active = DB.shift_instances.filter(s=>s.status==='active');

  // Xodim faqat o'z smenasini ko'radi
  if(!isManager()){
    active = active.filter(s => s.employee_id === currentUser.employeeId);
  }

  if(!active.length){
    sec.innerHTML = empty('🕐',
      isManager()
        ? 'Faol smenalar yo\'q.\n➕ tugmasini bosing!'
        : 'Sizda faol smena yo\'q.\nMenejerga murojaat qiling!');
    return;
  }

  sec.innerHTML = active.map(si=>{
    const emp = DB.employees.find(e=>e.id===si.employee_id);
    const shift = DB.shifts.find(s=>s.id===si.shift_id);
    if(!emp || !shift) return '';
    const started = new Date(si.started_at).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});
    return `
    <div class="list-item">
      <div class="avatar green">🕐</div>
      <div class="info">
        <div class="title">${esc(emp.name)}</div>
        <div class="sub">${esc(shift.start_time)} - ${esc(shift.end_time)} • ${started}</div>
      </div>
      ${badge(shift.name,'green')}
      ${isManager() ? `<button class="btn-del" onclick="endShift(${si.id})">⏹️</button>` : ''}
    </div>`;
  }).join('');
}

// =========================================================
// RENDER — TOPSHIRIQLAR
// =========================================================
function renderTasks(){
  const sec = document.getElementById('sec-tasks');
  let tasks = DB.tasks;

  // Xodim faqat o'z topshiriqlarini ko'radi
  if(!isManager()){
    tasks = tasks.filter(t => t.assigned_employee_id === currentUser.employeeId);
  }

  if(!tasks.length){
    sec.innerHTML = empty('📋',
      isManager()
        ? 'Topshiriqlar yo\'q.\n➕ tugmasini bosing!'
        : 'Sizda topshiriqlar yo\'q. 🎉');
    return;
  }

  const pCls = {high:'red', normal:'orange', low:'gray'};
  const sCls = {pending:'orange', in_progress:'blue', completed:'green'};
  const sLbl = {pending:'Kutilmoqda', in_progress:'Jarayonda', completed:'Bajarilgan'};

  sec.innerHTML = tasks.map(t=>{
    const emp = DB.employees.find(e=>e.id===t.assigned_employee_id);
    const canAct = isManager() || t.assigned_employee_id === currentUser.employeeId;

    return `
    <div class="list-item" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="info">
          <div class="title">${esc(t.title)}</div>
          <div class="sub">${emp?esc(emp.name):'— biriktirilmagan'}</div>
        </div>
        ${badge(t.priority, pCls[t.priority]||'gray')}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:8px">
        ${badge(sLbl[t.status]||t.status, sCls[t.status]||'gray')}
        <div class="actions" style="margin:0">
          ${canAct && t.status==='pending' ? `<button class="btn btn-success btn-sm" onclick="startTask(${t.id})">▶️ Boshlash</button>` : ''}
          ${canAct && t.status==='in_progress' ? `<button class="btn btn-primary btn-sm" onclick="completeTask(${t.id})">✅ Yakunlash</button>` : ''}
          ${isManager() ? `<button class="btn-del" onclick="deleteItem('tasks',${t.id})">🗑️</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// =========================================================
// RENDER — TOVARLAR
// =========================================================
function renderProducts(){
  const sec = document.getElementById('sec-products');
  if(!DB.products.length){
    sec.innerHTML = empty('📦','Tovarlar yo\'q.\n➕ tugmasini bosing!');
    return;
  }
  sec.innerHTML = DB.products.map(p=>{
    const batches = DB.product_batches.filter(b=>b.product_id===p.id && b.quantity > 0);
    const totalQty = batches.reduce((sum,b)=>sum+b.quantity,0);
    const problemBatches = batches.filter(b=>getSrokStatus(b.expiry_date).cls !== 'normal').length;
    return `
    <div class="list-item">
      <div class="avatar purple">📦</div>
      <div class="info">
        <div class="title">${esc(p.name)}</div>
        <div class="sub">${esc(p.category)||'—'} • ${totalQty} dona ${problemBatches ? '• ⚠️ '+problemBatches+' partiya' : ''}</div>
      </div>
      ${badge(p.category||'—','purple')}
      ${isManager() ? `<button class="btn-del" onclick="deleteItem('products',${p.id})">🗑️</button>` : ''}
    </div>`;
  }).join('');
}

// =========================================================
// RENDER — SROK
// =========================================================
function renderExpiry(){
  const sec = document.getElementById('sec-expiry');
  if(!DB.product_batches.length){
    sec.innerHTML = empty('⏰','Srok yozuvlari yo\'q.\n➕ tugmasini bosing va\nmahsulot partiyasini qo\'shing!');
    return;
  }
  const s = srokStats();
  const statsHtml = `
    <div class="srok-stats">
      <div class="srok-stat expired"><div class="num" style="color:#ef4444">${s.expired}</div><div class="lbl">Muddati o'tgan</div></div>
      <div class="srok-stat today"><div class="num" style="color:#dc2626">${s.today}</div><div class="lbl">Bugun</div></div>
      <div class="srok-stat critical"><div class="num" style="color:#f59e0b">${s.critical}</div><div class="lbl">3 kun ichida</div></div>
      <div class="srok-stat warning"><div class="num" style="color:#eab308">${s.warning}</div><div class="lbl">7 kun ichida</div></div>
      <div class="srok-stat normal"><div class="num" style="color:#10b981">${s.normal}</div><div class="lbl">Normada</div></div>
    </div>`;

  const sorted = [...DB.product_batches].sort((a,b)=>{
    const da = new Date(a.expiry_date).getTime();
    const db = new Date(b.expiry_date).getTime();
    return da - db;
  });

  const itemsHtml = sorted.map(b=>{
    const product = DB.products.find(p=>p.id===b.product_id);
    if(!product) return '';
    const s = getSrokStatus(b.expiry_date);
    return `
    <div class="srok-item ${s.cls}">
      <div class="srok-days ${s.cls}">
        <div>${s.ico}</div>
        <div style="font-size:11px;font-weight:600">${s.days !== null ? (s.days < 0 ? '!'+Math.abs(s.days) : s.days) : '—'}</div>
      </div>
      <div class="info">
        <div class="title">${esc(product.name)}</div>
        <div class="sub">${fmtDate(b.expiry_date)} • ${b.quantity} dona</div>
        <div style="margin-top:4px">
          <span class="badge ${s.cls === 'expired' ? 'red' : s.cls === 'today' ? 'red' : s.cls === 'critical' ? 'orange' : s.cls === 'warning' ? 'yellow' : 'green'}">
            ${s.label}
          </span>
        </div>
      </div>
      ${isManager() ? `<button class="btn-del" onclick="deleteBatch(${b.id})">🗑️</button>` : ''}
    </div>`;
  }).join('');

  sec.innerHTML = statsHtml + '<div style="padding:0 12px">' + itemsHtml + '</div>';
}

// =========================================================
// RENDER — MUAMMOLAR
// =========================================================
function renderIssues(){
  const sec = document.getElementById('sec-issues');
  if(!DB.issues.length){
    sec.innerHTML = empty('⚠️','Muammolar yo\'q. Ajoyib! 🎉');
    return;
  }
  const pCls = {high:'red', normal:'orange', low:'gray'};
  sec.innerHTML = DB.issues.map(i=>`
    <div class="list-item">
      <div class="avatar orange">⚠️</div>
      <div class="info">
        <div class="title">${esc(i.title)}</div>
        <div class="sub">${esc(i.status)}</div>
      </div>
      ${badge(i.priority, pCls[i.priority]||'gray')}
      ${isManager() ? `<button class="btn-del" onclick="deleteItem('issues',${i.id})">🗑️</button>` : ''}
    </div>

}

// =========================================================
// NAVIGATION
// =========================================================
function switchTab(name){
  currentTab = name;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.sidebar-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+name).classList.add('active');

  // FAB ko'rinishi
  const fab = document.getElementById('fabBtn');
  if(isManager()){
    fab.style.display = 'flex';
  } else {
    // Xodim faqat muammo qo'shishi mumkin
    fab.style.display = (name === 'issues') ? 'flex' : 'none';
  }

  refresh();
}

document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click', ()=>switchTab(b.dataset.tab)));
document.querySelectorAll('.sidebar-btn').forEach(b=>b.addEventListener('click', ()=>switchTab(b.dataset.tab)));

// =========================================================
// ACTIONS
// =========================================================
function startTask(id){
  const t = DB.tasks.find(x=>x.id===id);
  if(!t) return;

  // Himoya: xodim faqat o'z topshirig'ini boshqaradi
  if(!isManager() && t.assigned_employee_id !== currentUser.employeeId){
    toast('❌ Bu sizning topshirig\'ingiz emas!', 'error');
    return;
  }

  t.status = 'in_progress';
  DB.save(); refresh();
  toast('✅ Topshiriq boshlandi','success');
}

function completeTask(id){
  const t = DB.tasks.find(x=>x.id===id);
  if(!t) return;

  if(!isManager() && t.assigned_employee_id !== currentUser.employeeId){
    toast('❌ Bu sizning topshirig\'ingiz emas!', 'error');
    return;
  }

  t.status = 'completed';
  t.completed_at = new Date().toISOString();
  DB.save(); refresh();
  toast('✅ Topshiriq yakunlandi','success');
}

function endShift(id){
  if(!isManager()){
    toast('❌ Faqat menejer bu amalni qila oladi!', 'error');
    return;
  }
  if(!confirm('Smenani yakunlaysizmi?')) return;
  const si = DB.shift_instances.find(x=>x.id===id);
  if(si){ si.status = 'ended'; si.ended_at = new Date().toISOString(); DB.save(); refresh(); toast('✅ Smena yakunlandi','success'); }
}

function deleteItem(table, id){
  if(!isManager()){
    toast('❌ Faqat menejer o\'chira oladi!', 'error');
    return;
  }
  if(!confirm('O\'chirishni tasdiqlaysizmi?')) return;
  DB[table] = DB[table].filter(i=>i.id!==id);
  DB.save(); refresh(); toast('🗑️ O\'chirildi','success');
}

function deleteBatch(id){
  if(!isManager()){
    toast('❌ Faqat menejer o\'chira oladi!', 'error');
    return;
  }
  if(!confirm('Bu partiyani o\'chirasizmi?')) return;
  DB.product_batches = DB.product_batches.filter(b=>b.id!==id);
  DB.save(); refresh(); toast('🗑️ Partiya o\'chirildi','success');
}

function exportData(){ DB.export(); toast('✅ Fayl yuklandi','success'); }
function importData(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try {
        const data = JSON.parse(ev.target.result);
        DB.import(data);
        toast('✅ Import muvaffaqiyatli','success');
        closeModal(); refresh();
      } catch(err){ toast('❌ Xato: ' + err.message, 'error'); }
    };
    reader.readAsText(file);
  };
  input.click();
}
function clearData(){
  if(!isManager()){
    toast('❌ Faqat menejer uchun!', 'error');
    return;
  }
  if(!confirm('BARCHA ma\'lumotlarni o\'chirasizmi?')) return;
  if(!confirm('Ishonchingiz komilmi?')) return;
  localStorage.removeItem('store_control_db');
  DB.load(); closeModal(); refresh();
  toast('🗑️ Hammasi tozalandi','success');
}

// =========================================================
// SAVE
// =========================================================
function save(type){
  if(!isManager()){
    toast('❌ Faqat menejer qo\'sha oladi!', 'error');
    return;
  }

  const v = id => (document.getElementById(id)?.value || '').trim();
  const n = id => parseInt(document.getElementById(id)?.value) || null;

  if(type==='employees'){
    if(!v('f_name')) return toast('Ism kiritilishi shart','error');
    DB.employees.push({id: DB.nextId('employees'), store_id: 1, name: v('f_name'),
      phone: v('f_phone')||null, role: v('f_role'), status: 'active', created_at: new Date().toISOString()});
  }
  else if(type==='shifts'){
    const empId = n('f_emp'), shiftId = n('f_shift');
    if(!empId){ toast('Xodim tanlanishi shart','error'); return; }
    const exists = DB.shift_instances.find(s=>s.employee_id===empId && s.status==='active');
    if(exists){ toast('Xodimda allaqachon faol smena bor','error'); return; }
    DB.shift_instances.push({id: DB.nextId('shift_instances'), shift_id: shiftId,
      employee_id: empId, status: 'active', started_at: new Date().toISOString()});
  }
  else if(type==='tasks'){
    if(!v('f_title')) return toast('Sarlavha kiritilishi shart','error');
    DB.tasks.push({id: DB.nextId('tasks'), store_id: 1, title: v('f_title'),
      description: v('f_desc')||null, assigned_employee_id: n('f_emp'),
      priority: v('f_priority'), status: 'pending', is_photo_required: false,
      created_at: new Date().toISOString()});
  }
  else if(type==='products'){
    if(!v('f_name')) return toast('Nomi kiritilishi shart','error');
    DB.products.push({id: DB.nextId('products'), store_id: 1, name: v('f_name'),
      barcode: v('f_barcode')||null, category: v('f_category')||null,
      created_at: new Date().toISOString()});
  }
  else if(type==='expiry'){
    const prodId = n('f_prod'), qty = n('f_qty'), expiry = v('f_expiry');
    if(!prodId) return toast('Tovar tanlanishi shart','error');
    if(!qty || qty < 1) return toast('Miqdor kiritilishi shart','error');
    if(!expiry) return toast('Srok sanasi kiritilishi shart','error');
    DB.product_batches.push({
      id: DB.nextId('product_batches'), product_id: prodId,
      batch_number: v('f_batch')||null, quantity: qty,
      received_date: v('f_received')||new Date().toISOString().slice(0,10),
      expiry_date: expiry, created_at: new Date().toISOString()
    });
    const s = getSrokStatus(expiry);
    if(s.cls === 'expired') toast('⚠️ Diqqat! Muddati o\'tgan!','error');
    else if(s.cls === 'today') toast('⚠️ Bugun tugaydi!','error');
    else if(s.cls === 'critical') toast('⚠️ ' + s.days + ' kun ichida tugaydi!','warning');
    else toast('✅ Partiya qo\'shildi','success');
    DB.save(); closeModal(); refresh();
    return;
  }
  else if(type==='issues'){
    if(!v('f_title')) return toast('Sarlavha kiritilishi shart','error');
    DB.issues.push({id: DB.nextId('issues'), store_id: 1, title: v('f_title'),
      description: v('f_desc')||null, priority: v('f_priority'), status: 'open',
      created_at: new Date().toISOString()});
  }

  DB.save(); closeModal(); toast('✅ Saqlandi','success'); refresh();
}

// =========================================================
// REFRESH
// =========================================================
function refresh(){
  if(!currentUser.role) return;
  loadStats();
  const renderers = {
    employees: renderEmployees, shifts: renderShifts, tasks: renderTasks,
    products: renderProducts, expiry: renderExpiry, issues: renderIssues
  };
  (renderers[currentTab] || renderEmployees)();

  // FAB holatini yangilash
  const fab = document.getElementById('fabBtn');
  if(isManager()){
    fab.style.display = 'flex';
  } else {
    fab.style.display = (currentTab === 'issues') ? 'flex' : 'none';
  }
}

// =========================================================
// INIT
// =========================================================
DB.load();
loadUser();

window.addEventListener('load', () => {
  setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash) {
      splash.classList.add('hide');
      setTimeout(() => splash.remove(), 600);
    }

    // Agar foydalanuvchi saqlangan bo'lsa — avtomatik kirish
    if(currentUser.role){
      document.getElementById('login').classList.add('hide');
      document.getElementById('mainApp').style.display = '';
      applyRole();
      refresh();
    }
  }, 1500);
});

let lastWidth = window.innerWidth;
window.addEventListener('resize', ()=>{
  const w = window.innerWidth;
  const wasMobile = lastWidth < 768;
  const isMobile = w < 768;
  if(wasMobile !== isMobile){ refresh(); }
  lastWidth = w;
});
