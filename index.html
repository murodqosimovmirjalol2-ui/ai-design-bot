<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Store Control">
<meta name="description" content="Supermarket boshqaruv tizimi">
<title>Store Control</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:#f0f2f5;color:#333;line-height:1.5;overscroll-behavior:none;
-webkit-font-smoothing:antialiased}
.app{max-width:500px;margin:0 auto;min-height:100vh;background:#f0f2f5;
position:relative;padding-bottom:90px}

/* HEADER */
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
color:white;padding:16px 20px;position:sticky;top:0;z-index:100;
box-shadow:0 4px 20px rgba(102,126,234,.3)}
.header-top{display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.status{background:rgba(255,255,255,.2);padding:5px 12px;border-radius:20px;
font-size:11px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(10px)}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* STATS */
.stats{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:white;border-radius:14px;padding:14px;
box-shadow:0 2px 8px rgba(0,0,0,.04);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#667eea}
.stat.blue::before{background:#3b82f6}
.stat.green::before{background:#10b981}
.stat.orange::before{background:#f59e0b}
.stat.red::before{background:#ef4444}
.stat.purple::before{background:#8b5cf6}
.stat .label{font-size:10px;color:#888;font-weight:600;
letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.stat .value{font-size:24px;font-weight:800;color:#333;line-height:1}
.stat.full{grid-column:1/-1}

/* NAV */
.nav{background:white;margin:0 12px 12px;padding:5px;border-radius:14px;
display:flex;gap:3px;box-shadow:0 2px 8px rgba(0,0,0,.04);
position:sticky;top:64px;z-index:99}
.nav-btn{flex:1;padding:8px 4px;border:none;background:transparent;
border-radius:10px;cursor:pointer;font-size:10px;font-weight:600;
color:#666;display:flex;flex-direction:column;align-items:center;
gap:3px;font-family:inherit;transition:all .2s}
.nav-btn .ico{font-size:18px;line-height:1}
.nav-btn.active{background:linear-gradient(135deg,#667eea,#764ba2);
color:white;box-shadow:0 4px 12px rgba(102,126,234,.3)}

/* CONTENT */
.content{padding:0 12px}
.section{display:none}
.section.active{display:block}
.list-item{background:white;border-radius:14px;padding:14px;margin-bottom:8px;
box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;
gap:12px;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;
align-items:center;justify-content:center;font-weight:800;color:white;
font-size:14px;flex-shrink:0}
.avatar.blue{background:#3b82f6}
.avatar.green{background:#10b981}
.avatar.purple{background:#8b5cf6}
.avatar.orange{background:#f59e0b}
.avatar.red{background:#ef4444}
.info{flex:1;min-width:0}
.info .title{font-weight:700;font-size:14px;margin-bottom:2px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .sub{font-size:12px;color:#888;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{padding:4px 10px;border-radius:12px;font-size:10px;font-weight:700;
white-space:nowrap}
.badge.blue{background:#dbeafe;color:#1e40af}
.badge.green{background:#d1fae5;color:#065f46}
.badge.orange{background:#fef3c7;color:#92400e}
.badge.red{background:#fee2e2;color:#991b1b}
.badge.purple{background:#ede9fe;color:#6b21a8}
.badge.gray{background:#f3f4f6;color:#4b5563}
.actions{display:flex;gap:6px;margin-top:8px}
.btn{padding:6px 12px;border:none;border-radius:8px;font-size:11px;
font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:active{transform:scale(.95)}
.btn-sm{padding:6px 10px;font-size:11px}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:white}
.btn-success{background:#10b981;color:white}
.btn-danger{background:#ef4444;color:white}
.btn-del{background:#fee2e2;color:#dc2626;padding:6px 8px;font-size:14px;
border-radius:8px;border:none;cursor:pointer}
.empty{text-align:center;padding:50px 20px;color:#999}
.empty .ico{font-size:56px;margin-bottom:12px;opacity:.4}
.empty p{font-size:13px}

/* FAB */
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;
border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);
color:white;border:none;font-size:24px;cursor:pointer;
box-shadow:0 6px 20px rgba(102,126,234,.4);z-index:50;
display:flex;align-items:center;justify-content:center;transition:transform .2s}
.fab:active{transform:scale(.9)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);
backdrop-filter:blur(4px);z-index:1000;display:none;
align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:white;border-radius:24px 24px 0 0;padding:24px;
width:100%;max-width:500px;max-height:90vh;overflow-y:auto;
animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{margin-bottom:18px;font-size:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;
border:2px solid #e5e7eb;border-radius:12px;font-size:15px;
font-family:inherit;background:#fafbfc;transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{
outline:none;border-color:#667eea;background:white}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn-lg{padding:12px 24px;font-size:14px;border-radius:12px}
.btn-cancel{background:#f3f4f6;color:#666}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,200px);
background:#1f2937;color:white;padding:12px 20px;border-radius:12px;
font-size:13px;font-weight:600;z-index:2000;transition:transform .3s;
max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.success{background:#059669}
.toast.error{background:#dc2626}

/* SETTINGS MENU */
.menu-btn{background:rgba(255,255,255,.2);border:none;color:white;
width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;
display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.menu-btn:active{background:rgba(255,255,255,.3)}

/* DATA ACTIONS */
.data-actions{display:flex;gap:8px;margin-top:12px}
.data-actions button{flex:1;padding:10px;border:none;border-radius:10px;
font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.data-actions .export{background:#dbeafe;color:#1e40af}
.data-actions .import{background:#d1fae5;color:#065f46}
.data-actions .clear{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="header-top">
            <h1>🏪 Store Control</h1>
            <div style="display:flex;gap:8px;align-items:center">
                <div class="status">
                    <span class="dot"></span>
                    <span>Faol</span>
                </div>
                <button class="menu-btn" onclick="openSettings()">⚙️</button>
            </div>
        </div>
    </div>

    <div class="stats">
        <div class="stat blue">
            <div class="label">Xodimlar</div>
            <div class="value" id="sEmp">0</div>
        </div>
        <div class="stat green">
            <div class="label">Smenalar</div>
            <div class="value" id="sShift">0</div>
        </div>
        <div class="stat orange">
            <div class="label">Topshiriq</div>
            <div class="value" id="sTask">0</div>
        </div>
        <div class="stat red">
            <div class="label">Muammo</div>
            <div class="value" id="sIssue">0</div>
        </div>
        <div class="stat purple full">
            <div class="label">Tovarlar</div>
            <div class="value" id="sProduct">0</div>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" data-tab="employees">
            <span class="ico">👥</span>Xodimlar
        </button>
        <button class="nav-btn" data-tab="shifts">
            <span class="ico">🕐</span>Smenalar
        </button>
        <button class="nav-btn" data-tab="tasks">
            <span class="ico">📋</span>Topshiriq
        </button>
        <button class="nav-btn" data-tab="products">
            <span class="ico">📦</span>Tovarlar
        </button>
        <button class="nav-btn" data-tab="issues">
            <span class="ico">⚠️</span>Muammo
        </button>
    </div>

    <div class="content">
        <div class="section active" id="sec-employees"></div>
        <div class="section" id="sec-shifts"></div>
        <div class="section" id="sec-tasks"></div>
        <div class="section" id="sec-products"></div>
        <div class="section" id="sec-issues"></div>
    </div>
</div>

<button class="fab" onclick="openModal()">➕</button>

<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
    <div class="modal" id="modalContent" onclick="event.stopPropagation()"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// =========================================================
// MA'LUMOTLAR BAZASI (localStorage)
// =========================================================
const DB = {
    stores: [],
    employees: [],
    shifts: [],
    shift_instances: [],
    tasks: [],
    products: [],
    issues: [],

    load(){
        const data = localStorage.getItem('store_control_db');
        if(data){
            try {
                const parsed = JSON.parse(data);
                Object.assign(this, parsed);
            } catch(e){ this.seed(); }
        } else {
            this.seed();
        }
    },

    seed(){
        this.stores = [{id:1, name:"Asosiy Do'kon", address:"Toshkent"}];
        this.shifts = [
            {id:1, store_id:1, name:"1-smena", start_time:"08:00", end_time:"16:00"},
            {id:2, store_id:1, name:"2-smena", start_time:"16:00", end_time:"00:00"}
        ];
        this.save();
    },

    save(){
        const data = {
            stores: this.stores,
            employees: this.employees,
            shifts: this.shifts,
            shift_instances: this.shift_instances,
            tasks: this.tasks,
            products: this.products,
            issues: this.issues
        };
        localStorage.setItem('store_control_db', JSON.stringify(data));
    },

    nextId(table){
        const items = this[table];
        if(!items.length) return 1;
        return Math.max(...items.map(i=>i.id)) + 1;
    },

    export(){
        const data = {
            stores: this.stores,
            employees: this.employees,
            shifts: this.shifts,
            shift_instances: this.shift_instances,
            tasks: this.tasks,
            products: this.products,
            issues: this.issues,
            exported_at: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'store-control-' + new Date().toISOString().slice(0,10) + '.json';
        a.click();
        URL.revokeObjectURL(url);
    },

    import(data){
        if(!data || typeof data !== 'object') throw new Error('Noto\'g\'ri format');
        ['stores','employees','shifts','shift_instances','tasks','products','issues'].forEach(k=>{
            if(Array.isArray(data[k])) this[k] = data[k];
        });
        this.save();
    }
};

// =========================================================
// HOLAT
// =========================================================
let currentTab = 'employees';

// =========================================================
// TOAST
// =========================================================
function toast(msg, type){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type||'');
    setTimeout(()=>t.classList.add('show'),10);
    setTimeout(()=>t.classList.remove('show'),2500);
}

// =========================================================
// STATS
// =========================================================
function loadStats(){
    const activeShifts = DB.shift_instances.filter(s=>s.status==='active').length;
    const openTasks = DB.tasks.filter(t=>t.status!=='completed').length;
    const openIssues = DB.issues.filter(i=>i.status==='open').length;

    document.getElementById('sEmp').textContent = DB.employees.length;
    document.getElementById('sShift').textContent = activeShifts;
    document.getElementById('sTask').textContent = openTasks;
    document.getElementById('sIssue').textContent = openIssues;
    document.getElementById('sProduct').textContent = DB.products.length;
}

// =========================================================
// HELPERS
// =========================================================
function empty(ico, txt){
    return '<div class="empty"><div class="ico">'+ico+'</div><p>'+txt+'</p></div>';
}
function badge(txt, cls){
    return '<span class="badge '+(cls||'gray')+'">'+txt+'</span>';
}
function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}

// =========================================================
// RENDER
// =========================================================
function renderEmployees(){
    const sec = document.getElementById('sec-employees');
    if(!DB.employees.length){
        sec.innerHTML = empty('👥','Xodimlar yo\'q.\n➕ tugmasini bosing!');
        return;
    }
    sec.innerHTML = DB.employees.map(e=>`
        <div class="list-item">
            <div class="avatar blue">${e.id}</div>
            <div class="info">
                <div class="title">${esc(e.name)}</div>
                <div class="sub">${esc(e.phone)||'—'}</div>
            </div>
            ${badge(e.role,'blue')}
            <button class="btn-del" onclick="deleteItem('employees',${e.id})">🗑️</button>
        </div>
    `).join('');
}

function renderShifts(){
    const sec = document.getElementById('sec-shifts');
    const active = DB.shift_instances.filter(s=>s.status==='active');
    if(!active.length){
        sec.innerHTML = empty('🕐','Faol smenalar yo\'q.\n➕ tugmasini bosing!');
        return;
    }
    sec.innerHTML = active.map(si=>{
        const emp = DB.employees.find(e=>e.id===si.employee_id);
        const shift = DB.shifts.find(s=>s.id===si.shift_id);
        if(!emp || !shift) return '';
        const started = new Date(si.started_at).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});
        return `
        <div class="list-item">
            <div class="avatar green">🕐</div>
            <div class="info">
                <div class="title">${esc(emp.name)}</div>
                <div class="sub">${esc(shift.start_time)} - ${esc(shift.end_time)} • ${started}</div>
            </div>
            ${badge(shift.name,'green')}
            <button class="btn-del" onclick="endShift(${si.id})">⏹️</button>
        </div>`;
    }).join('');
}

function renderTasks(){
    const sec = document.getElementById('sec-tasks');
    if(!DB.tasks.length){
        sec.innerHTML = empty('📋','Topshiriqlar yo\'q.\n➕ tugmasini bosing!');
        return;
    }
    const pCls = {high:'red', normal:'orange', low:'gray'};
    const sCls = {pending:'orange', in_progress:'blue', completed:'green'};
    const sLbl = {pending:'Kutilmoqda', in_progress:'Jarayonda', completed:'Bajarilgan'};

    sec.innerHTML = DB.tasks.map(t=>{
        const emp = DB.employees.find(e=>e.id===t.assigned_employee_id);
        return `
        <div class="list-item" style="flex-direction:column;align-items:stretch">
            <div style="display:flex;align-items:center;gap:10px">
                <div class="info">
                    <div class="title">${esc(t.title)}</div>
                    <div class="sub">${emp?esc(emp.name):'— biriktirilmagan'}</div>
                </div>
                ${badge(t.priority, pCls[t.priority]||'gray')}
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
                ${badge(sLbl[t.status]||t.status, sCls[t.status]||'gray')}
                <div class="actions" style="margin:0">
                    ${t.status==='pending' ? `<button class="btn btn-success btn-sm" onclick="startTask(${t.id})">▶️ Boshlash</button>` : ''}
                    ${t.status==='in_progress' ? `<button class="btn btn-primary btn-sm" onclick="completeTask(${t.id})">✅ Yakunlash</button>` : ''}
                    <button class="btn-del" onclick="deleteItem('tasks',${t.id})">🗑️</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function renderProducts(){
    const sec = document.getElementById('sec-products');
    if(!DB.products.length){
        sec.innerHTML = empty('📦','Tovarlar yo\'q.\n➕ tugmasini bosing!');
        return;
    }
    sec.innerHTML = DB.products.map(p=>`
        <div class="list-item">
            <div class="avatar purple">📦</div>
            <div class="info">
                <div class="title">${esc(p.name)}</div>
                <div class="sub">#${esc(p.barcode)||'—'}</div>
            </div>
            ${badge(p.category||'—','purple')}
            <button class="btn-del" onclick="deleteItem('products',${p.id})">🗑️</button>
        </div>
    `).join('');
}

function renderIssues(){
    const sec = document.getElementById('sec-issues');
    if(!DB.issues.length){
        sec.innerHTML = empty('⚠️','Muammolar yo\'q. Ajoyib! 🎉');
        return;
    }
    const pCls = {high:'red', normal:'orange', low:'gray'};
    sec.innerHTML = DB.issues.map(i=>`
        <div class="list-item">
            <div class="avatar orange">⚠️</div>
            <div class="info">
                <div class="title">${esc(i.title)}</div>
                <div class="sub">${esc(i.status)}</div>
            </div>
            ${badge(i.priority, pCls[i.priority]||'gray')}
            <button class="btn-del" onclick="deleteItem('issues',${i.id})">🗑️</button>
        </div>
    `).join('');
}

// =========================================================
// NAVIGATION
// =========================================================
function switchTab(name){
    currentTab = name;
    document.querySelectorAll('.nav-btn').forEach(b=>{
        b.classList.toggle('active', b.dataset.tab===name);
    });
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById('sec-'+name).classList.add('active');
    refresh();
}

document.querySelectorAll('.nav-btn').forEach(b=>{
    b.addEventListener('click', ()=>switchTab(b.dataset.tab));
});

// =========================================================
// ACTIONS
// =========================================================
function startTask(id){
    const t = DB.tasks.find(x=>x.id===id);
    if(t){ t.status = 'in_progress'; DB.save(); refresh(); toast('✅ Topshiriq boshlandi','success'); }
}
function completeTask(id){
    const t = DB.tasks.find(x=>x.id===id);
    if(t){ t.status = 'completed'; t.completed_at = new Date().toISOString(); DB.save(); refresh(); toast('✅ Topshiriq yakunlandi','success'); }
}
function endShift(id){
    if(!confirm('Smenani yakunlaysizmi?')) return;
    const si = DB.shift_instances.find(x=>x.id===id);
    if(si){ si.status = 'ended'; si.ended_at = new Date().toISOString(); DB.save(); refresh(); toast('✅ Smena yakunlandi','success'); }
}
function deleteItem(table, id){
    if(!confirm('O\'chirishni tasdiqlaysizmi?')) return;
    DB[table] = DB[table].filter(i=>i.id!==id);
    DB.save();
    refresh();
    toast('🗑️ O\'chirildi','success');
}

// =========================================================
// MODAL
// =========================================================
function openModal(){
    const forms = {
        employees: `
            <h3>➕ Yangi xodim</h3>
            <div class="field"><label>Ism *</label>
                <input id="f_name" placeholder="Ali Valiyev" autofocus></div>
            <div class="field"><label>Telefon</label>
                <input id="f_phone" placeholder="+998901234567" inputmode="tel"></div>
            <div class="field"><label>Rol</label>
                <select id="f_role">
                    <option value="employee">Xodim</option>
                    <option value="manager">Menejer</option>
                    <option value="admin">Admin</option>
                </select></div>
            <div class="modal-actions">
                <button class="btn btn-cancel btn-lg" onclick="closeModal()">Bekor</button>
                <button class="btn btn-primary btn-lg" onclick="save('employees')">Saqlash</button>
            </div>`,
        shifts: `
            <h3>🕐 Smena boshlash</h3>
            <div class="field"><label>Xodim</label>
                <select id="f_emp">${DB.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>
            <div class="field"><label>Smena</label>
                <select id="f_shift">${DB.shifts.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.start_time}-${s.end_time})</option>`).join('')}</select></div>
            <div class="modal-actions">
                <button class="btn btn-cancel btn-lg" onclick="closeModal()">Bekor</button>
                <button class="btn btn-success btn-lg" onclick="save('shifts')">Boshlash</button>
            </div>`,
        tasks: `
            <h3>➕ Yangi topshiriq</h3>
            <div class="field"><label>Sarlavha *</label>
                <input id="f_title" placeholder="Non bo'limini tekshirish" autofocus></div>
            <div class="field"><label>Tavsif</label>
                <textarea id="f_desc" rows="2"></textarea></div>
            <div class="field"><label>Xodim</label>
                <select id="f_emp">
                    <option value="">— Hech kim —</option>
                    ${DB.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}
                </select></div>
            <div class="field"><label>Prioritet</label>
                <select id="f_priority">
                    <option value="low">Past</option>
                    <option value="normal" selected>O'rta</option>
                    <option value="high">Yuqori</option>
                </select></div>
            <div class="modal-actions">
                <button class="btn btn-cancel btn-lg" onclick="closeModal()">Bekor</button>
                <button class="btn btn-primary btn-lg" onclick="save('tasks')">Saqlash</button>
            </div>`,
        products: `
            <h3>➕ Yangi tovar</h3>
            <div class="field"><label>Nomi *</label>
                <input id="f_name" placeholder="Oq non" autofocus></div>
            <div class="field"><label>Shtrix kod</label>
                <input id="f_barcode" inputmode="numeric"></div>
            <div class="field"><label>Kategoriya</label>
                <input id="f_category" placeholder="non"></div>
            <div class="modal-actions">
                <button class="btn btn-cancel btn-lg" onclick="closeModal()">Bekor</button>
                <button class="btn btn-primary btn-lg" onclick="save('products')">Saqlash</button>
            </div>`,
        issues: `
            <h3>➕ Yangi muammo</h3>
            <div class="field"><label>Sarlavha *</label>
                <input id="f_title" placeholder="Kassa ishlamayapti" autofocus></div>
            <div class="field"><label>Tavsif</label>
                <textarea id="f_desc" rows="2"></textarea></div>
            <div class="field"><label>Prioritet</label>
                <select id="f_priority">
                    <option value="low">Past</option>
                    <option value="normal" selected>O'rta</option>
                    <option value="high">Yuqori</option>
                </select></div>
            <div class="modal-actions">
                <button class="btn btn-cancel btn-lg" onclick="closeModal()">Bekor</button>
                <button class="btn btn-primary btn-lg" onclick="save('issues')">Saqlash</button>
            </div>`
    };
    document.getElementById('modalContent').innerHTML = forms[currentTab] || forms.employees;
    document.getElementById('modalBg').classList.add('show');
}

function closeModal(e){
    if(e && e.target.id !== 'modalBg') return;
    document.getElementById('modalBg').classList.remove('show');
}

// =========================================================
// SETTINGS
// =========================================================
function openSettings(){
    const stats = `
        <div style="background:#f9fafb;border-radius:12px;padding:14px;margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e5e7eb">
                <span style="font-size:13px;color:#666">Xodimlar</span>
                <strong style="font-size:13px">${DB.employees.length}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e5e7eb">
                <span style="font-size:13px;color:#666">Faol smenalar</span>
                <strong style="font-size:13px">${DB.shift_instances.filter(s=>s.status==='active').length}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e5e7eb">
                <span style="font-size:13px;color:#666">Topshiriqlar</span>
                <strong style="font-size:13px">${DB.tasks.length}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e5e7eb">
                <span style="font-size:13px;color:#666">Tovarlar</span>
                <strong style="font-size:13px">${DB.products.length}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;padding:6px 0">
                <span style="font-size:13px;color:#666">Muammolar</span>
                <strong style="font-size:13px">${DB.issues.length}</strong>
            </div>
        </div>

        <div class="data-actions">
            <button class="export" onclick="exportData()">💾 Eksport</button>
            <button class="import" onclick="importData()">📂 Import</button>
            <button class="clear" onclick="clearData()">🗑️ Tozalash</button>
        </div>

        <p style="font-size:11px;color:#999;text-align:center;margin-top:16px">
            Ma'lumotlar faqat shu telefonda saqlanadi
        </p>

        <div class="modal-actions">
            <button class="btn btn-cancel btn-lg" onclick="closeModal()">Yopish</button>
        </div>
    `;
    document.getElementById('modalContent').innerHTML = stats;
    document.getElementById('modalBg').classList.add('show');
}

function exportData(){
    DB.export();
    toast('✅ Fayl yuklandi','success');
}

function importData(){
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev)=>{
            try {
                const data = JSON.parse(ev.target.result);
                DB.import(data);
                toast('✅ Import muvaffaqiyatli','success');
                closeModal();
                refresh();
            } catch(err){
                toast('❌ Xato: ' + err.message, 'error');
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

function clearData(){
    if(!confirm('BARCHA ma\'lumotlarni o\'chirasizmi? Bu amalni qaytarib bo\'lmaydi!')) return;
    if(!confirm('Ishonchingiz komilmi?')) return;
    localStorage.removeItem('store_control_db');
    DB.load();
    closeModal();
    refresh();
    toast('🗑️ Hammasi tozalandi','success');
}

// =========================================================
// SAVE
// =========================================================
function save(type){
    const v = id => (document.getElementById(id)?.value || '').trim();
    const n = id => parseInt(document.getElementById(id)?.value) || null;

    if(type==='employees'){
        if(!v('f_name')) return toast('Ism kiritilishi shart','error');
        DB.employees.push({
            id: DB.nextId('employees'),
            store_id: 1,
            name: v('f_name'),
            phone: v('f_phone')||null,
            role: v('f_role'),
            status: 'active',
            created_at: new Date().toISOString()
        });
    }
    else if(type==='shifts'){
        const empId = n('f_emp');
        const shiftId = n('f_shift');
        if(!empId){ toast('Xodim tanlanishi shart','error'); return; }
        const exists = DB.shift_instances.find(s=>s.employee_id===empId && s.status==='active');
        if(exists){ toast('Xodimda allaqachon faol smena bor','error'); return; }
        DB.shift_instances.push({
            id: DB.nextId('shift_instances'),
            shift_id: shiftId,
            employee_id: empId,
            status: 'active',
            started_at: new Date().toISOString()
        });
    }
    else if(type==='tasks'){
        if(!v('f_title')) return toast('Sarlavha kiritilishi shart','error');
        DB.tasks.push({
            id: DB.nextId('tasks'),
            store_id: 1,
            title: v('f_title'),
            description: v('f_desc')||null,
            assigned_employee_id: n('f_emp'),
            priority: v('f_priority'),
            status: 'pending',
            is_photo_required: false,
            created_at: new Date().toISOString()
        });
    }
    else if(type==='products'){
        if(!v('f_name')) return toast('Nomi kiritilishi shart','error');
        DB.products.push({
            id: DB.nextId('products'),
            store_id: 1,
            name: v('f_name'),
            barcode: v('f_barcode')||null,
            category: v('f_category')||null,
            created_at: new Date().toISOString()
        });
    }
    else if(type==='issues'){
        if(!v('f_title')) return toast('Sarlavha kiritilishi shart','error');
        DB.issues.push({
            id: DB.nextId('issues'),
            store_id: 1,
            title: v('f_title'),
            description: v('f_desc')||null,
            priority: v('f_priority'),
            status: 'open',
            created_at: new Date().toISOString()
        });
    }

    DB.save();
    closeModal();
    toast('✅ Saqlandi','success');
    refresh();
}

// =========================================================
// REFRESH
// =========================================================
function refresh(){
    loadStats();
    const renderers = {
        employees: renderEmployees,
        shifts: renderShifts,
        tasks: renderTasks,
        products: renderProducts,
        issues: renderIssues
    };
    renderers[currentTab]();
}

// =========================================================
// INIT
// =========================================================
DB.load();
refresh();
</script>
</body>
</html>
